[project]
name = "math-harness"
version = "0.1.0"
description = "Verify AI-generated Lean proofs"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = ["typer", "rich"]

[project.scripts]
mh = "math_harness.cli:app"
math-harness = "math_harness.cli:app"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/math_harness"]

[tool.pytest.ini_options]
addopts = "-m 'not lean'"
markers = ["lean: needs a Lean toolchain"]
